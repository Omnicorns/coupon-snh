spring.application.name=coupon
server.port=8050

# ================= Portal Sarinah (sumber data) =================
sarinah-portal.base-url=https://192.168.70.98/api/public
sarinah-portal.coupon.url=${sarinah-portal.base-url}/get_pos_product_discount

# ================= HTTP client =================
http.client.max-connections=300
http.client.max-per-route=100
http.client.connection-request-timeout=5000
http.client.connect-timeout=10000
http.client.read-timeout=60000

# ================= Database (PostgreSQL) =================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ================= Scheduler sync =================
# tiap 30 menit (untuk dev cepat: 0 0/1 * * * *)
coupon.sync.cron=0 0/5 * * * *
coupon.get.cron=0 0/5 * * * *

# ================= Lain-lain =================
server.error.include-stacktrace=never
coupon.security.api-keys=keyAAA111:partner-a,keyBBB222:partner-b

