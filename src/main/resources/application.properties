spring.application.name=coupon
server.port=8050

# ================= Portal Sarinah (sumber data) =================
sarinah-portal.base-url=https://192.168.70.98/api/public
sarinah-portal.coupon.url=${sarinah-portal.base-url}/get_pos_product_discount
sarinah-portal.coupon.order.url=${sarinah-portal.base-url}/pos_order_history

# ================= HTTP client =================
http.client.max-connections=300
http.client.max-per-route=100
http.client.connection-request-timeout=5000
http.client.connect-timeout=10000
http.client.read-timeout=60000

# ================= Database (PostgreSQL) =================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ================= Scheduler sync =================
# tiap 30 menit (untuk dev cepat: 0 0/1 * * * *)
coupon.sync.cron=0 0/5 * * * *
coupon.get.cron=0 0/5 * * * *

# ================= Lain-lain =================
server.error.include-stacktrace=never
coupon.security.api-keys=keyAAA111:partner-a,keyBBB222:partner-b


prime.webhook.enabled=${PRIME_WEBHOOK_ENABLED:true}
prime.webhook.url=${PRIME_WEBHOOK_URL:https://integrated.injourney.id/sarinah/webhook}
prime.webhook.secret=${PRIME_WEBHOOK_SECRET:}
prime.webhook.connect-timeout=5s
prime.webhook.read-timeout=10s
prime.webhook.batch-size=50
prime.webhook.max-retry-window=24h
prime.webhook.dispatch-interval-ms=30000
prime.webhook.dispatch-initial-delay-ms=15000
prime.webhook.order-lookup-days=1
prime.webhook.order-lookup-fallback-days=7



